<!DOCTYPE html>
<html>
<head>
  <title>Employee Management System</title>
</head>
<body>
   <h1>Employee Management System</h1>

  <div>
    <label for="idInput">Enter the id of the Employee: </label>
    <input type="number" id="idInput" placeholder="Enter the ID"><br><br>
    <label for="specializationInput">Enter the Employee Specialization: </label>
    <input type="text" id="specializationInput" placeholder="Enter specialization"><br><br>
    <button onclick="displayEmployees()">Display Employees</button>
    <button onclick="calculateTotalSalaries()">Calculate Total Salaries</button>
    <button onclick="displayHREmployees()">Display HR Employees</button>
    <button onclick="findEmployeeById(Number(document.getElementById('idInput').value))">Find Employee by ID</button>
    <button onclick="findEmployeeBySpecialization(document.getElementById('specializationInput').value)">Find Employee By Specialization</button>
  </div>

 <div id="employeesDetails"></div>
<script src="./employee_details.js"></script>
</body>
</html>
